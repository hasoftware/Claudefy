name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node test/cli.test.js
      - run: node --check bin/cli.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check bin/cli.js
      - name: Verify no install scripts
        run: |
          if node -e "const p=require('./package.json'); if(p.scripts.preinstall||p.scripts.postinstall||p.scripts.install){process.exit(1)}"; then
            echo "✓ No install scripts (safe supply chain)"
          else
            echo "✗ Found install scripts!" && exit 1
          fi
      - name: Verify zero dependencies
        run: |
          node -e "const p=require('./package.json'); const d=Object.keys(p.dependencies||{}); if(d.length>0){console.error('Has dependencies:',d);process.exit(1)}"
          echo "✓ Zero dependencies"
